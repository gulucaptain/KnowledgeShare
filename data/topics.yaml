topics:
  - slug: wam
    title: WAM
    description: 世界—动作模型及其训练、推理、数据与评测方法，重点关注统一建模环境变化与机器人动作。
    semantic_scope:
      - World-Action Model
      - 联合世界建模与动作生成
      - 机器人视频预测与动作预测的统一模型
    keywords:
      - WAM
      - world-action model
      - action-conditioned world model
      - robot action generation
      - embodied AI

  - slug: world-model
    title: World Model
    description: 通过预测未来状态、视觉表征或环境动态来支持规划与控制的世界模型，不要求同时生成动作。
    semantic_scope:
      - 潜空间世界模型
      - 视觉动态预测
      - 面向机器人规划的未来状态预测
