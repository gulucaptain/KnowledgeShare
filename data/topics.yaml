topics:
  - slug: wam
    title: WAM
    description: 世界—动作模型及其训练、推理、数据与评测方法，重点关注统一建模环境变化与机器人动作。
    semantic_scope:
      - World-Action Model
      - 联合世界建模与动作生成
      - 机器人视频预测与动作预测的统一模型
    keywords:
      - WAM
      - world-action model
      - action-conditioned world model
      - robot action generation
      - embodied AI

  - slug: world-model
    title: World Model
    description: 通过预测未来状态、视觉表征或环境动态来支持规划与控制的世界模型，不要求同时生成动作。
    semantic_scope:
      - 潜空间世界模型
      - 视觉动态预测
      - 面向机器人规划的未来状态预测
      - 多视角世界建模
    keywords:
      - world model
      - latent planning
      - future prediction
      - cross-view modeling
      - visual dynamics

  - slug: audio-video-generation
    title: Audio-Video Generation
    description: 联合生成视频与声音、音画同步、跨模态交互以及音视频生成结果的高分辨率精炼。
    semantic_scope:
      - 原生音视频联合生成
      - 音画同步生成
      - 音频与视频跨模态建模
      - 音视频生成后处理与精炼
    keywords:
      - audio-video generation
      - joint audio video
      - synchronized audio
      - video generation
      - multimodal generation

  - slug: audio-video-evaluation
    title: Audio-Video Evaluation
    description: 音视频理解与生成系统的评测方法、数据集、基准和指标，关注视觉、音频与跨模态一致性。
    semantic_scope:
      - 音视频模型评测
      - 音画理解与跨模态一致性评估
      - 用于音视频评测的数据集与基准
      - 音视频生成质量评估
    keywords:
      - audio-video evaluation
      - audio visual benchmark
      - video dataset
      - multimodal evaluation
      - audio visual understanding

  - slug: embodied-ai-icl
    title: Embodied AI ICL
    description: 通过演示、视频或上下文提示，让具身模型在不更新参数或极少适配的情况下理解并执行新任务。
    semantic_scope:
      - 机器人模仿学习中的上下文学习
      - 以人类或机器人演示作为任务提示
      - 具身基础模型的单样本与少样本适配
      - 开放任务上的上下文泛化
    keywords:
      - embodied AI
      - in-context learning
      - imitation learning
      - one-shot robot learning
      - human demonstration

  - slug: r4r-auto-eval
    title: R4R-Auto-Eval
    description: 面向机器人策略与执行轨迹的自动化评测、过程审计、奖励建模和故障检测方法。
    semantic_scope:
      - 机器人执行过程的细粒度自动评测
      - 过程奖励模型与轨迹审计
      - 机器人故障检测和执行监控
      - 基于视觉或程序的机器人评测
    keywords:
      - robot auto evaluation
      - robotic auditing
      - process reward model
      - failure detection
      - execution monitoring

  - slug: video-generation-icl
    title: Video Generation ICL
    description: 利用上下文视频、参考图像或视觉示例控制视频生成、编辑与运动迁移的方法。
    semantic_scope:
      - 视频生成中的上下文学习
      - 参考视频驱动的运动与镜头迁移
      - 无训练样本配对的视频重构与编辑
    keywords:
      - video generation
      - in-context generation
      - motion transfer
      - video reimagination
      - reference video

  - slug: camera-trajectory-understanding
    title: Camera Trajectory Understanding
    description: 视频中的相机运动、相机位姿、轨迹标注、识别与评测相关的数据和方法。
    semantic_scope:
      - 动态视频的相机位姿估计
      - 相机运动分类、描述与理解
      - 相机轨迹数据集与评测基准
    keywords:
      - camera trajectory
      - camera motion
      - camera pose
      - structure from motion
      - video understanding

  - slug: code-as-policy
    title: Code-As-Policy
    description: 让语言模型以程序生成、工具调用或可执行策略的方式控制和评测机器人。
    semantic_scope:
      - 语言模型生成机器人控制程序
      - 代码作为机器人策略或动作接口
      - 具身智能的可执行评测框架
    keywords:
      - code as policy
      - robot code generation
      - physical AI evaluation
      - executable policy
      - robot agent

  - slug: embodied-harness
    title: Embodied Harness
    description: 连接通用视觉语言模型与具体机器人本体的轻量控制接口、动作解释器和执行框架。
    semantic_scope:
      - 通用模型到机器人动作空间的适配层
      - 具身模型的动作接口与控制支架
      - 跨机器人本体的语义动作表达
    keywords:
      - embodied harness
      - VLM robot control
      - action interface
      - embodiment adapter
      - robot foundation model

  - slug: camera-noise
    title: CameraNoise
    description: 通过优化扩散噪声、潜变量或采样轨迹，在推理阶段改善视频生成的可控性与内容对齐。
    semantic_scope:
      - 视频扩散模型的测试时噪声优化
      - 奖励引导的潜变量与采样轨迹优化
      - 无需更新生成模型参数的推理时增强
    keywords:
      - CameraNoise
      - noise optimization
      - test-time scaling
      - latent optimization
      - text-to-video generation

  - slug: robot-manipulation
    title: Robot Manipulation
    description: 面向机械臂与其他关节机器人的操作执行方法与工具，关注逆运动学、任务空间控制、多目标约束和运动求解。
    semantic_scope:
      - 机械臂逆运动学与末端执行器控制
      - 从任务空间目标到关节速度或构型的求解
      - 多任务与运动约束下的机器人操作控制
      - 面向操作执行的运动学与优化工具
    keywords:
      - robot manipulation
      - inverse kinematics
      - end-effector control
      - motion control
      - quadratic programming
